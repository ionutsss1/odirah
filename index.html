<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ODIRAH Website</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500&family=Cormorant+Garamond:ital@0;1&display=swap">
<style>
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#301E15;color:#E3D5CF;font-family:"Cormorant Garamond",Georgia,serif;padding:24px}
main{max-width:34rem;text-align:center}
img{width:180px;margin:0 auto 40px;display:block}
p{font-style:italic;font-size:1.2rem;margin:0 0 40px;opacity:.85}
nav{display:grid;gap:14px}
a{display:block;padding:16px 20px;border:1px solid rgba(227,213,207,.4);color:inherit;text-decoration:none;font-family:"Cormorant SC",Georgia,serif;letter-spacing:.18em;font-size:.9rem}
a:hover{background:#E3D5CF;color:#301E15}
small{display:block;margin-top:6px;font-family:"Cormorant Garamond",Georgia,serif;letter-spacing:0;font-size:.95rem;opacity:.75}
</style>
<main>
  <img src="site/assets/brand/odirah-wordmark.svg" alt="ODIRAH" style="filter:invert(91%) sepia(8%) saturate(260%) hue-rotate(320deg)">
  <p>Website, Phase 1</p>
  <nav>
    <a href="site/">Homepage concept<small>High-fidelity design with campaign imagery</small></a>
    <a href="docs/approval/">Approval pack<small>Sitemap, journey map and wireframes</small></a>
  </nav>
</main>
</html>
